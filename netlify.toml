# Netlify serves korzengroup.com from Korzen101/korzengroup-site (2026-09-26).
# The repo holds the site already built by ConvoyExpo's
# site/build-korzengroup.mjs, so there is nothing for Netlify to build.
[build]
  publish = "."

# What a <meta> Content-Security-Policy cannot say: no other site may frame
# these pages. Each page's own policy, hashed at build, still applies with it.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # No page here uses the camera, the microphone, location, motion
    # sensors, payments or USB (2026-10-04, the website review's small
    # fixes); turned off, a script that got in could not ask for them
    # either. Passkeys (Admin) and copying (Admin's invitation link) keep
    # their defaults, which are this site only.
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()"
    # Another site's window opened from here (or opening one of these) shares nothing with it.
    Cross-Origin-Opener-Policy = "same-origin"
