<body>
<main><h1>Not found</h1><p><a href="/">Korzen LLC</a></p></main>
<script>
/* Until GitHub's "Enforce HTTPS" is on, send visitors to https the moment the
   certificate works: a picture fetched over https that loads proves it does,
   for this host, so this host is where they go (www since 2026-09-26; the bare
   domain's certificate is GitHub's to issue). */
(function () {
  if (window.top !== window.self) { try { window.top.location.replace(window.location.href); } catch (e) {} }
  if (location.protocol !== 'http:' || !/(^|\.)korzengroup\.com$/.test(location.hostname)) return;
  var probe = new Image();
  probe.onload = function () { location.replace('https://' + location.hostname + location.pathname + location.search + location.hash); };
  probe.src = 'https://' + location.hostname + '/favicon.svg?https-check=' + Date.now();
})();
</script>
