<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korzen LLC</title>
<meta name="description" content="Korzen LLC">
<link rel="canonical" href="https://korzengroup.com/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" as="image" href="/img/supercar-1672.webp" imagesrcset="/img/supercar-960.webp 960w, /img/supercar-1672.webp 1672w" imagesizes="(max-width: 700px) 125vw, min(1672px, 100vw)">
<meta name="theme-color" content="#000000">
<style>
@font-face { font-family: Archivo; src: url(/archivo.woff) format('woff'); font-weight: 100 900; font-display: swap; }
/* The photo's edges are pure black, so the page is too and there is no seam. */
:root { color-scheme: dark; --ink: #f2f3f5; --line: rgba(242,243,245,.16); }
* { box-sizing: border-box; }
html, body { margin: 0; background: #000; }
body {
  color: var(--ink); min-height: 100vh; min-height: 100svh; overflow-x: hidden;
  font: 16px/1.5 Archivo, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
header { position: absolute; top: 0; left: 0; right: 0; z-index: 2; display: flex; justify-content: flex-end; padding: 20px clamp(16px, 4vw, 40px); }
.admin {
  color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14px; letter-spacing: .08em; text-transform: uppercase;
  padding: 9px 16px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.04);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: background .2s, border-color .2s;
}
.admin:hover { background: rgba(255,255,255,.1); border-color: rgba(242,243,245,.34); }
.admin:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
main { min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.hero { position: relative; width: min(1672px, 100vw); flex: none; }
.hero img { display: block; width: 100%; height: auto; }
.hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 14%; background: linear-gradient(to bottom, rgba(0,0,0,0), #000); pointer-events: none; }
h1 {
  position: absolute; left: 0; right: 0; top: 13%; margin: 0; text-align: center;
  font-weight: 800; letter-spacing: .32em; text-indent: .32em; text-transform: uppercase; line-height: 1;
  font-size: clamp(26px, 5.6vw, 84px);
  background: linear-gradient(180deg, #ffffff 0%, #c9ccd2 55%, #8d9199 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
}
@media (max-width: 700px) {
  .hero { width: 125vw; }
  h1 { top: 10%; font-size: clamp(22px, 7.4vw, 44px); }
}
@media (prefers-reduced-motion: no-preference) {
  .hero img { animation: reveal 1.6s cubic-bezier(.2,.7,.1,1) both; }
  h1 { animation: rise 1.2s .2s cubic-bezier(.2,.7,.1,1) both; }
  @keyframes reveal { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>
<header><a class="admin" href="/admin/">Admin</a></header>
<main>
  <div class="hero">
    <picture>
      <source type="image/webp" srcset="/img/supercar-960.webp 960w, /img/supercar-1672.webp 1672w" sizes="(max-width: 700px) 125vw, min(1672px, 100vw)">
      <img src="/img/supercar-1672.jpg" srcset="/img/supercar-960.jpg 960w, /img/supercar-1672.jpg 1672w" sizes="(max-width: 700px) 125vw, min(1672px, 100vw)" width="1672" height="941" alt="A black supercar in low light">
    </picture>
    <h1>Korzen LLC</h1>
  </div>
</main>
</body>
</html>
